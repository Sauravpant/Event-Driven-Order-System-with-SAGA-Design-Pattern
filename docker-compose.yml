version: "3.9"

services:
  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '0@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT'
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga_pw}
      POSTGRES_DB: ${ORDER_DB_NAME:-order_db}
    volumes:
      - ./services/order-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saga} -d ${ORDER_DB_NAME:-order_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  inventory-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga_pw}
      POSTGRES_DB: ${INVENTORY_DB_NAME:-inventory_db}
    volumes:
      - ./services/inventory-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saga} -d ${INVENTORY_DB_NAME:-inventory_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga_pw}
      POSTGRES_DB: ${PAYMENT_DB_NAME:-payment_db}
    volumes:
      - ./services/payment-service/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saga} -d ${PAYMENT_DB_NAME:-payment_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./services/order-service
    environment:
      PGHOST: order-db
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga_pw}
      ORDER_DB_NAME: ${ORDER_DB_NAME:-order_db}
      KAFKA_BROKERS: kafka:9092
      INVENTORY_SERVICE_URL: http://inventory-service:4002
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-750}
      PORT: 4001
    depends_on:
      order-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "4001:4001"
    restart: on-failure

  inventory-service:
    build: ./services/inventory-service
    environment:
      PGHOST: inventory-db
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga_pw}
      INVENTORY_DB_NAME: ${INVENTORY_DB_NAME:-inventory_db}
      KAFKA_BROKERS: kafka:9092
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-750}
      PORT: 4002
    depends_on:
      inventory-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "4002:4002"
    restart: on-failure

  payment-service:
    build: ./services/payment-service
    environment:
      PGHOST: payment-db
      POSTGRES_USER: ${POSTGRES_USER:-saga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saga_pw}
      PAYMENT_DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      KAFKA_BROKERS: kafka:9092
      PAYMENT_FAILURE_RATE: ${PAYMENT_FAILURE_RATE:-0.25}
      OUTBOX_POLL_INTERVAL_MS: ${OUTBOX_POLL_INTERVAL_MS:-750}
      PORT: 4003
    depends_on:
      payment-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "4003:4003"
    restart: on-failure

  api-gateway:
    build: ./services/api-gateway
    environment:
      ORDER_SERVICE_URL: http://order-service:4001
      INVENTORY_SERVICE_URL: http://inventory-service:4002
      PORT: 4000
    depends_on:
      - order-service
      - inventory-service
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:4000
    depends_on:
      - api-gateway
    ports:
      - "5173:5173"
